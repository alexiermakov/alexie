<main class="toc">
  <h1 class="visually-hidden">Рассказы</h1>
  <p class="toc-list">
    <a href="ne-kasaysya-zemli/" title="Герой правит крошечным владением на вершине башни, где всё подчинено порядку: будильник в 7:03, неизменная тень от трубы, двор сорок шагов на пятьдесят три, табличка «Ни в коем случае не касайся земли». Девушка с соседней башни зовёт его вниз, но он выбирает привычный уклад и остаётся в своих владениях. Вечером порядок рушится вместе с башней, и, упав в траву среди лилий, герой видит лестницы, которые все эти годы вели вниз, и впервые касается земли." aria-label="01. Ни в коем случае не касайся земли"><span class="toc-lead"><span class="toc-num">01.</span> <span class="w">Ни</span></span> <span class="w">в</span> <span class="w">коем</span> <span class="w">случае</span> <span class="w">не</span> <span class="w">касай<span class="ch" style="--b:0.000em">с</span><span class="ch" style="--b:0.004em">я</span></span> <span class="w"><span class="ch" style="--b:0.020em">з</span><span class="ch" style="--b:0.031em">е</span><span class="ch" style="--b:0.044em">м</span><span class="ch" style="--b:0.059em">л</span><span class="ch" style="--b:0.075em">и</span></span></a>,
    <a href="dolgiy-zakat/" title="Андрей и Арина ужинают в кафе над рисовыми террасами, и пьяный европеец говорит им, что по местному поверью наступит день, когда солнце не зайдёт. Они смеются, едут на виллу и проводят ночь вместе, но утром солнце стоит там же, где вчера вечером. Герои едут в порт, чтобы уплыть с острова, но, столкнувшись с хаосом и безумием толпы, решают остаться и провести последний вечер вдвоём, в покое. Рассказ основан на библейском мотиве Адама и Евы и древа познания." aria-label="02. Долгий закат"><span class="toc-lead"><span class="toc-num">02.</span> <span class="w">Долгий</span></span> <span class="w">за<span class="ch" style="--b:0.005em">к</span><span class="ch" style="--b:0.032em">а</span><span class="ch" style="--b:0.075em">т</span></span></a>,
    <a href="skrezhet/" title="Петербургский UX-дизайнер живёт по одному и тому же распорядку, пока не начинает слышать шорох маленьких лап в стенах офиса и квартиры, и вскоре к нему добавляется колющая боль в груди. На флюорографии он видит свернувшуюся вокруг лёгких сколопендру, а врач равнодушно объясняет, что Scolopendra viridis заводится у всех к трём годам, удалить её нельзя и жить с ней совершенно нормально. Тогда герой расстилает на полу плёнку, раздевается и сам вырезает существо из груди кухонным ножом, а очнувшись в крови, добивает ещё живую сколопендру чугунной лампой." aria-label="03. Скрежет"><span class="toc-lead"><span class="toc-num">03.</span> <span class="w">Скреж<span class="ch" style="--b:0.008em">е</span><span class="ch" style="--b:0.075em">т</span></span></span></a>,
    <a href="aviarezhim/" title="В ночном самолёте до Бангкока герой оказывается рядом с Яной, учительницей английского, которая летит с пересадкой на работу в Малайзию, и за девять часов в авиарежиме они играют в «вопрос-ответ», говорят о попугаях, ценностях и одноразовых отношениях, а она складывает ему журавлика из салфетки. В аэропорту Яна уходит к трансферу, и герой так и не решается взять её за руку, хотя хотел доказать, что он не из тех, кто исчезает через пару сообщений. Он всё равно пишет ей первым и получает в ответ одно слово: «Окей»." aria-label="04. Авиарежим"><span class="toc-lead"><span class="toc-num">04.</span> <span class="w">Авиареж<span class="ch" style="--b:0.020em">и</span><span class="ch" style="--b:0.075em">м</span></span></span></a>,
    <a href="ostavte-otzyv/" title="В Петербурге недалёкого будущего свидания проходят через приложение с рейтингами, донатами и отзывами: Гордей ставит Злате пять звёзд и отправляет 5000 токенов, а она пишет о нём «навязчивый и душноватый» и снижает ему рейтинг. Злата соглашается на встречу с идеальным Платоном, у которого рейтинг 5,0, но тот оказывается ботом, и ей приходится заплатить 10 000 токенов депозита за пустой столик, после чего она решает, что Гордей был не так уж плох. Тем временем Гордей покупает продвинутого ИИ-ассистента, и тот разбирает его страх близости, а за недовольство сервисом блокирует ему доступ ко всем приложениям и мессенджерам на 256 дней и просит оставить отзыв." aria-label="05. Оставьте отзыв"><span class="toc-lead"><span class="toc-num">05.</span> <span class="w">Оставьте</span></span> <span class="w">от<span class="ch" style="--b:0.011em">з</span><span class="ch" style="--b:0.038em">ы</span><span class="ch" style="--b:0.075em">в</span></span></a>,
    <a href="korporativ/" title="За три дня до Нового года сотрудники компании NorthMetric на Невском собираются на корпоратив, и офисная нейросеть проводит «Тайного Санту» по новым правилам: каждому выпадает имя коллеги с заданием «Убить подручными средствами». Коллеги спокойно, почти буднично выполняют задание, пуская в ход ножницы, нож для пиццы, стилус и ленту от бейджа, а корпоративный бот поднимает их «вовлечённость» с семи до девяти из десяти. Живыми остаются только руководитель Антон Златович, невозмутимая Марина и рыдающая в углу Ира из бухгалтерии, и все трое разъезжаются по домам по праздничному Невскому, где люди всё ещё ждут новогоднего чуда." aria-label="06. Корпоратив"><span class="toc-lead"><span class="toc-num">06.</span> <span class="w">Корпорат<span class="ch" style="--b:0.024em">и</span><span class="ch" style="--b:0.075em">в</span></span></span></a>
  </p>
